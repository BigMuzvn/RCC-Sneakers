; Limites de téléversement des visuels produits.
;
; Ce fichier est lu par PHP en CGI/FPM — le mode de la quasi-totalité des
; mutualisés, cPanel compris. Les hébergeurs restés en mod_php lisent les mêmes
; valeurs dans .htaccess, juste à côté ; les deux disent la même chose pour que
; le dossier se déploie tel quel, quel que soit le serveur en face.
;
; 2 Mo par défaut ne suffisaient pas : un rendu de maillot dépasse largement, et
; une photo prise au téléphone tourne autour de 3 à 6 Mo. Le poids du fichier
; reçu n'a de toute façon aucune incidence sur ce qui est conservé — ImageStore
; ré-encode tout en WebP à 1200 px, soit une centaine de kilo-octets. Ce qui
; protège vraiment la mémoire est le plafond de 40 millions de pixels, qui vit
; dans le code et ne dépend pas de cette valeur.
;
; post_max_size doit rester au-dessus de upload_max_filesize : il porte
; l'enveloppe entière — le fichier, les champs du formulaire et leurs bornes.
; S'il est dépassé, PHP vide $_POST et $_FILES sans rien dire.

upload_max_filesize = 8M
post_max_size = 12M
